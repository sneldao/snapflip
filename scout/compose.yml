services:
  agent:
    build: .
    # Once the image is pushed, this can be `image:` instead of `build:` —
    # e.g. image: ghcr.io/YOUR_ACCOUNT/snapflip-scout@sha256:<digest>
    env_file: ./plow-credentials
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - state:/var/lib/plow
    restart: unless-stopped
    stop_grace_period: 35s
  # Local/VPS dev only: plays Plow's agent-web proxy so localhost:3001 behaves
  # like the production dashboard. Anyone who reaches localhost:3001 is admin.
  dev-dashboard:
    image: caddy:2@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    network_mode: service:agent
    depends_on: [agent]
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
volumes:
  state:
